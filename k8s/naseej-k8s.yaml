# Naseej sur Kubernetes (Minikube)
# Prerequis : lancer k8s/create-secret.sh (namespace, secret, config init PostGIS)
# ======================= BASE DE DONNEES : AUTH =======================
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: naseej
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: naseej_user
            - name: POSTGRES_DB
              value: auth_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naseej-secret
                  key: AUTH_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U naseej_user -d auth_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ================ BASE DE DONNEES : EMERGENCY (PostGIS) ================
apiVersion: v1
kind: Service
metadata:
  name: emergency-db
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: emergency-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emergency-db
  namespace: naseej
spec:
  serviceName: emergency-db
  replicas: 1
  selector:
    matchLabels:
      app: emergency-db
  template:
    metadata:
      labels:
        app: emergency-db
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: emergency_user
            - name: POSTGRES_DB
              value: emergency_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naseej-secret
                  key: EMERGENCY_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U emergency_user -d emergency_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: emergency-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ======================== AUTH-SERVICE ========================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: naseej
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h auth-db -p 5432; do echo attente auth-db; sleep 2; done"]
      containers:
        - name: auth-service
          image: naseej-auth:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naseej-secret
                  key: AUTH_DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://naseej_user:$(AUTH_DB_PASSWORD)@auth-db:5432/auth_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: naseej-secret
                  key: JWT_SECRET
            - name: JWT_ACCESS_TTL
              value: 1h
            - name: JWT_REFRESH_TTL
              value: 7d
            - name: DB_SYNC
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
---
