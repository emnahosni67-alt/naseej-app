# ========================= API-GATEWAY =========================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: naseej
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: naseej-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: naseej-secret
                  key: JWT_SECRET
            - name: AUTH_URL
              value: http://auth-service:3000
            - name: EMERGENCY_URL
              value: http://emergency-service:3000
            - name: TRANSPORT_URL
              value: http://transport-service:3000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
---
# ============ TRANSPORT-SERVICE : Service seul, sans pod ============
# Non deploye (limite de RAM). Le Service doit exister car nginx (frontend)
# resolve le nom transport-service au demarrage et refuse de demarrer sinon.
apiVersion: v1
kind: Service
metadata:
  name: transport-service
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: transport-service
  ports:
    - port: 3000
      targetPort: 3000
---
# ========================= WEB-FRONTEND =========================
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: naseej
spec:
  type: ClusterIP
  selector:
    app: web-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: naseej
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: naseej-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
